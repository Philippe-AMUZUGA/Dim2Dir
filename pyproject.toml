[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dim2dir"
dynamic = ["version"]
description = "Projection 2D et visualisation de plans d'expériences Excel et pandas"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Philippe AMUZUGA"}]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
keywords = ["plan d'expériences", "design of experiments", "visualization", "excel", "pandas", "matplotlib"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Visualization",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["openpyxl>=3.1", "matplotlib>=3.7", "pillow>=10"]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
excel = ["pywin32; sys_platform == 'win32'"]
dev = ["pytest>=8", "pytest-cov>=5", "build", "twine", "pandas>=2"]

[project.scripts]
dim2dir = "dim2dir.core:main"

[project.urls]
Homepage = "https://github.com/Philippe-AMUZUGA/Dim2Dir"
Source = "https://github.com/Philippe-AMUZUGA/Dim2Dir"
Issues = "https://github.com/Philippe-AMUZUGA/Dim2Dir/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["dim2dir"]
namespaces = false

[tool.setuptools.package-data]
dim2dir = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "dim2dir.core.__version__"}

name: Tests et distributions
on: [push, pull_request]
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: python -m pytest --cov=dim2dir --cov-report=term-missing --cov-fail-under=85 -m "not excel"
      - run: python tools/sync_standalone.py --check
      - run: python tools/verify_install.py
